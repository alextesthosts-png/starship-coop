name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Syntax check
        run: for f in server/*.js shared/*.js public/js/*.js; do node --check "$f"; done
      - name: Co-op smoke test (2 bot pilots, all missions)
        run: npm test -- "" 12
  forum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_sqlite }
      - name: PHP lint
        run: for f in forum/public/index.php forum/src/*.php; do php -l "$f"; done
